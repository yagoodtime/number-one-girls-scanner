<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Number One Girls 驗票</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 18px;
    }

    .card {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 24px;
    }

    select,
    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 10px;
      font-size: 18px;
    }

    select,
    input {
      border: 1px solid #ccc;
      background: white;
    }

    button {
      border: none;
      background: #222;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #stopBtn {
      display: none;
      background: #777;
    }

    #reader {
      width: 100%;
      margin-top: 18px;
    }

    #status {
      display: none;
      margin-top: 18px;
      padding: 22px;
      border-radius: 16px;
      text-align: center;
    }

    .success {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .wrong {
      background: #ffebee;
      color: #b71c1c;
    }

    .used {
      background: #fff8e1;
      color: #8d6e00;
    }

    .invalid {
      background: #ffebee;
      color: #b71c1c;
    }

    .processing {
      background: #eeeeee;
      color: #333;
    }

    .big {
      font-size: 38px;
      font-weight: bold;
      margin: 12px 0;
    }

    .name {
      font-size: 22px;
      margin: 8px 0;
    }

    #counter {
      margin-top: 18px;
      padding: 12px;
      background: #f7f7f7;
      border-radius: 10px;
      text-align: center;
      font-size: 18px;
    }

    .current-show {
      margin: 10px 0 18px;
      padding: 10px;
      border-radius: 10px;
      background: #f1f1f1;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Number One Girls</h1>

  <div class="subtitle">
    工作人員連續驗票
  </div>

  <select id="show">
    <option value="">請選擇驗票場次</option>
    <option value="空中場">空中場</option>
    <option value="舞蹈場">舞蹈場</option>
  </select>

  <input
    id="pin"
    type="password"
    inputmode="numeric"
    placeholder="工作人員 PIN"
  >

  <button
    id="startBtn"
    onclick="startScanner()"
  >
    開始驗票
  </button>

  <button
    id="stopBtn"
    onclick="stopScanner()"
  >
    停止驗票
  </button>

  <div
    id="currentShow"
    class="current-show"
    style="display:none;"
  ></div>

  <div id="reader"></div>

  <div id="status"></div>
<div
  id="liveStats"
  style="
    margin-top:18px;
    padding:18px;
    background:#eef5ff;
    border-radius:12px;
    text-align:center;
    display:none;
  "
>
  <div
    id="statsShow"
    style="
      font-size:22px;
      font-weight:bold;
      margin-bottom:8px;
    "
  ></div>

  <div style="font-size:20px;">
    已入場：
    <b id="checkedInCount">0</b>
    /
    <b id="totalCount">0</b>
  </div>

  <div
    style="
      margin-top:6px;
      font-size:16px;
      color:#666;
    "
  >
    尚未入場：
    <b id="remainingCount">0</b>
  </div>
</div>
  <div id="counter">
    本次已成功驗票：
    <b id="count">0</b>
    張
  </div>

</div>


<script>

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbxDYqtdwKzLg1PlBoxqGFj6vM4tkRiO5_28xr7u-T9qVlF5EoQh9k0wiVKbm2vYtN28/exec";


let scanner = null;

let scanning = false;

let processing = false;

let successCount = 0;

let lastTicket = "";

let lastScanTime = 0;


// ========================================
// 開始掃描
// ========================================

function startScanner() {

  const show =
    document.getElementById("show").value;

  const pin =
    document.getElementById("pin").value;


  if (!show) {

    alert("請先選擇空中場或舞蹈場");

    return;
  }


  if (!pin) {

    alert("請輸入工作人員 PIN");

    return;
  }


  document.getElementById("show").disabled =
    true;

  document.getElementById("pin").disabled =
    true;

  document.getElementById("startBtn")
    .style.display = "none";

  document.getElementById("stopBtn")
    .style.display = "block";


  const currentShowBox =
    document.getElementById("currentShow");

  currentShowBox.style.display =
    "block";

  currentShowBox.innerText =
    "目前驗票：" + show;
loadStats();

  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      const size =
        Math.floor(
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          ) * 0.7
        );

      return {
        width: size,
        height: size
      };
    }

  };


  scanner.start(

    {
      facingMode:
        "environment"
    },

    config,

    onScanSuccess,

    function(errorMessage) {

      // 正常掃描時大量辨識失敗，
      // 不需要顯示。

    }

  )

  .then(function() {

    scanning = true;

  })

  .catch(function(err) {

    alert(
      "無法開啟相機：" +
      err
    );

    resetControls();

  });

}


// ========================================
// 掃到 QR
// ========================================

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }


  const ticketId =
    String(decodedText).trim();


  // 防止鏡頭短時間內重複讀同一張票
  const now =
    Date.now();

  if (
    ticketId === lastTicket &&
    now - lastScanTime < 3000
  ) {

    return;
  }


  lastTicket =
    ticketId;

  lastScanTime =
    now;


  processing =
    true;


  const show =
    document.getElementById("show").value;

  const pin =
    document.getElementById("pin").value;


  showProcessing(ticketId);


  fetch(
    GAS_URL,
    {
      method: "POST",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:
        JSON.stringify({
          ticketId: ticketId,
          currentShow: show,
          pin: pin
        })
    }
  )

  .then(function(response) {

    return response.json();

  })

  .then(function(response) {

    handleResult(response);

  })

  .catch(function(error) {

    showResult(
      "invalid",
      "❌ 系統連線錯誤",
      "",
      error.message
    );

    resumeAfterDelay(2500);

  });

}


// ========================================
// 處理 GAS 回傳結果
// ========================================

function handleResult(response) {


  // 正常入場
  if (
  response.status === "success"
) {

  successCount++;

  document
    .getElementById("count")
    .innerText =
    successCount;

  // ⭐ 更新即時入場人數
  loadStats();

  // ⭐ 成功時嘗試震動
  if (navigator.vibrate) {
    navigator.vibrate(150);
  }

  showResult(
    "success",
    "✅ 入場成功",
    response.ticketType,
    response.name +
    "<br>" +
    response.ticketId
  );

  resumeAfterDelay(1500);

  return;
}


    resumeAfterDelay(1500);

    return;
  }


  // 場次不符
  if (
    response.status === "wrong_show"
  ) {

    showResult(
      "wrong",
      "❌ 場次不符",
      "此票為：" +
      response.ticketType,
      "目前驗票：" +
      response.currentShow
    );


    resumeAfterDelay(2500);

    return;
  }


  // 已經用過
  if (
    response.status === "used"
  ) {

    showResult(
      "used",
      "⚠️ 此票已使用",
      response.ticketType,
      response.name +
      "<br>" +
      "入場時間：" +
      response.checkInTime
    );


    resumeAfterDelay(2500);

    return;
  }


  // PIN 錯誤
  if (
    response.status === "bad_pin"
  ) {

    showResult(
      "wrong",
      "❌ PIN 錯誤",
      "",
      "請停止驗票並重新輸入 PIN"
    );


    processing =
      false;

    return;
  }


  // 無效票
  showResult(
    "invalid",
    "❌ 無效票券",
    "",
    response.message ||
    "查無此票"
  );


  resumeAfterDelay(2500);

}


// ========================================
// 顯示處理中
// ========================================

function showProcessing(ticketId) {

  const box =
    document.getElementById("status");

  box.className =
    "processing";

  box.style.display =
    "block";

  box.innerHTML =
    "<b>查詢中...</b><br>" +
    ticketId;

}


// ========================================
// 顯示結果
// ========================================

function showResult(
  type,
  title,
  bigText,
  detail
) {

  const box =
    document.getElementById("status");

  box.className =
    type;

  box.style.display =
    "block";


  box.innerHTML =

    "<div style='" +
    "font-size:28px;" +
    "font-weight:bold;" +
    "'>" +
    title +
    "</div>" +


    (
      bigText
      ?
      "<div class='big'>" +
      bigText +
      "</div>"
      :
      ""
    ) +


    (
      detail
      ?
      "<div class='name'>" +
      detail +
      "</div>"
      :
      ""
    );

}


// ========================================
// 幾秒後繼續掃
// ========================================

function resumeAfterDelay(ms) {

  setTimeout(function() {

    document
      .getElementById("status")
      .style.display =
      "none";

    processing =
      false;

  }, ms);

}


// ========================================
// 停止驗票
// ========================================

function stopScanner() {

  if (
    !scanner ||
    !scanning
  ) {

    resetControls();

    return;
  }


  scanner
    .stop()

    .then(function() {

      scanning =
        false;

      document
        .getElementById("reader")
        .innerHTML =
        "";

      resetControls();

    })

    .catch(function(err) {

      alert(
        "停止相機時發生錯誤：" +
        err
      );

    });

}


// ========================================
// 恢復設定
// ========================================

function resetControls() {

  document
    .getElementById("show")
    .disabled =
    false;

  document
    .getElementById("pin")
    .disabled =
    false;


  document
    .getElementById("startBtn")
    .style.display =
    "block";

  document
    .getElementById("stopBtn")
    .style.display =
    "none";

  document
    .getElementById("currentShow")
    .style.display =
    "none";


  processing =
    false;

}
function loadStats() {

  const show =
    document.getElementById("show").value;

  if (!show) {
    return;
  }

  fetch(
    GAS_URL,
    {
      method: "POST",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:
        JSON.stringify({
          action: "stats",
          currentShow: show
        })
    }
  )

  .then(function(response) {
    return response.json();
  })

  .then(function(data) {

    document
      .getElementById("liveStats")
      .style.display =
      "block";

    document
      .getElementById("statsShow")
      .innerText =
      data.currentShow;

    document
      .getElementById("checkedInCount")
      .innerText =
      data.checkedIn;

    document
      .getElementById("totalCount")
      .innerText =
      data.total;

    document
      .getElementById("remainingCount")
      .innerText =
      data.remaining;

  })

  .catch(function(error) {

    console.log(
      "統計載入失敗",
      error
    );

  });
}
</script>

</body>
</html>
